<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>Preflight</title>
    <style id="theme-vars">
/* A股量化分析仪表盘 - 品牌设计令牌 */
/* TradingView 风格深色金融仪表盘 */

@layer theme {
  :root {
    /* Brand Primary - TradingView Blue */
    --aq-primary-50: #e8efff;
    --aq-primary-100: #c5d8ff;
    --aq-primary-200: #94b8ff;
    --aq-primary-300: #6193ff;
    --aq-primary-400: #3b76ff;
    --aq-primary-500: #2962ff;
    --aq-primary-600: #1f4fd9;
    --aq-primary-700: #183db3;
    --aq-primary-800: #122d8a;
    --aq-primary-900: #0c1f61;

    /* Neutral Scale */
    --aq-neutral-0: #ffffff;
    --aq-neutral-50: #f7f8fa;
    --aq-neutral-100: #eceef2;
    --aq-neutral-200: #d5d9e2;
    --aq-neutral-300: #b0b7c8;
    --aq-neutral-400: #8a94a8;
    --aq-neutral-500: #6b7280;
    --aq-neutral-600: #4b5563;
    --aq-neutral-700: #374151;
    --aq-neutral-800: #1f2937;
    --aq-neutral-900: #111827;
    --aq-neutral-950: #030712;

    /* Surface Scale (dark theme) */
    --aq-surface-base: #0c0d14;
    --aq-surface-elevated: #131722;
    --aq-surface-hover: #1e222d;
    --aq-surface-active: #2a2e39;
    --aq-border: #2a2e39;
    --aq-border-subtle: #1e222d;

    /* Text Scale */
    --aq-text-primary: #d1d4dc;
    --aq-text-secondary: #787b86;
    --aq-text-muted: #5d606b;
    --aq-text-inverse: #0c0d14;

    /* State Semantic */
    --state-success: #00c076;
    --state-success-bg: rgba(0, 192, 118, 0.12);
    --state-warning: #f59e0b;
    --state-warning-bg: rgba(245, 158, 11, 0.12);
    --state-error: #ff3b30;
    --state-error-bg: rgba(255, 59, 48, 0.12);
    --state-info: #2962ff;
    --state-info-bg: rgba(41, 98, 255, 0.12);

    /* Semantic Aliases */
    --aq-background: var(--aq-surface-base);
    --aq-foreground: var(--aq-text-primary);
    --aq-card: var(--aq-surface-elevated);
    --aq-card-foreground: var(--aq-text-primary);
    --aq-popover: var(--aq-surface-elevated);
    --aq-popover-foreground: var(--aq-text-primary);
    --aq-primary: var(--aq-primary-500);
    --aq-primary-foreground: var(--aq-neutral-0);
    --aq-muted: var(--aq-surface-hover);
    --aq-muted-foreground: var(--aq-text-secondary);
    --aq-border: var(--aq-border);
    --aq-input: var(--aq-surface-active);
    --aq-ring: var(--aq-primary-500);

    /* Radius */
    --aq-radius-sm: 4px;
    --aq-radius-md: 8px;
    --aq-radius-lg: 12px;
    --aq-radius-full: 9999px;

    /* Typography */
    --aq-font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --aq-font-mono: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace;

    /* Shadows - only for floating layers */
    --aq-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --aq-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
    --aq-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.25);
    --aq-shadow-glow: 0 0 24px rgba(41, 98, 255, 0.12);

    /* Spacing */
    --aq-space-1: 4px;
    --aq-space-2: 8px;
    --aq-space-3: 12px;
    --aq-space-4: 16px;
    --aq-space-5: 20px;
    --aq-space-6: 24px;
    --aq-space-8: 32px;
    --aq-space-10: 40px;
    --aq-space-12: 48px;
  }
}

@layer utilities {
  .text-positive { color: var(--state-success); }
  .text-negative { color: var(--state-error); }
  .bg-positive { background-color: var(--state-success-bg); }
  .bg-negative { background-color: var(--state-error-bg); }
  .font-mono { font-family: var(--aq-font-mono); }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    --color-muted: var(--aq-muted);

    --color-input: var(--aq-input);
    --color-ring: var(--aq-ring);
    --radius-sm: var(--aq-radius-sm);
    --radius-md: var(--aq-radius-md);
    --radius-lg: var(--aq-radius-lg);

  @layer base {
    body { background: var(--aq-background); color: var(--aq-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
